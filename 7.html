<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumb Pointer - Relative</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            cursor: none;
        }

        #video-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
            border: 2px solid #00ff00;
            z-index: 10;
        }

        video {
            display: block;
            width: 160px;
            height: 120px;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            z-index: 11;
        }

        #controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
        }

        button {
            font-size: 16px;
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
            background-color: #00cc00;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        button:hover {
            background-color: #00ff00;
        }
        button:disabled {
             background-color: #555;
             box-shadow: none;
             cursor: not-allowed;
        }

        #status {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background-color: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .crosshair {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid cyan;
            display: none;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
            transform: translate(-50%, -50%);
            will-change: transform, left, top, border-color, box-shadow, background-color;
            transition: transform 0.1s ease-out, background-color 0.1s ease-out,
                        border-color 0.1s ease-out, box-shadow 0.1s ease-out;
        }

        .crosshair::before, .crosshair::after {
            content: "";
            position: absolute;
            background-color: cyan;
            box-shadow: 0 0 5px cyan;
            transition: background-color 0.1s ease-out;
        }
        .crosshair::before {
            width: 2px; height: 100%; left: 50%; transform: translateX(-50%);
        }
        .crosshair::after {
            width: 100%; height: 2px; top: 50%; transform: translateY(-50%);
        }

        .crosshair.dragging {
            border-color: yellow;
            box-shadow: 0 0 20px yellow;
            background-color: rgba(255, 255, 0, 0.3);
            transform: translate(-50%, -50%) scale(1.2);
        }
        .crosshair.dragging::before, .crosshair.dragging::after {
             background-color: yellow;
             box-shadow: 0 0 8px yellow;
        }

    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startTracking()" disabled>Start Tracking</button>
        <button id="stop-btn" onclick="stopTracking()" disabled>Stop Tracking</button>
    </div>

    <p id="status">Loading model...</p>

    <div id="crosshair" class="crosshair"></div>

    <script>
        const video = document.getElementById("video");
        const videoContainer = document.getElementById("video-container");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const statusText = document.getElementById("status");
        const crosshair = document.getElementById("crosshair");
        const startBtn = document.getElementById("start-btn");
        const stopBtn = document.getElementById("stop-btn");

        let detector;
        let tracking = false;
        let rafId;

        const clickDistanceThreshold = 44;
        const smoothingFactor = 0.3;
        const sensitivity = 2.5;

        let smoothedX = window.innerWidth / 2;
        let smoothedY = window.innerHeight / 2;
        let isDragging = false;
        let relativeOriginVideo = { x: 0, y: 0 };
        let relativeOriginScreen = { x: 0, y: 0 };

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        console.log(`Video dimensions: ${video.videoWidth}x${video.videoHeight}`);
                        resolve();
                    };
                });
            } catch (error) {
                console.error("Error accessing camera:", error);
                statusText.innerText = "Error: Could not access camera. " + error.message;
                throw error;
            }
        }

        async function loadModel() {
            statusText.innerText = "Loading hand tracking model...";
            try {
                const model = handPoseDetection.SupportedModels.MediaPipeHands;
                const detectorConfig = {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
                    modelType: 'lite',
                    maxHands: 1
                };
                detector = await handPoseDetection.createDetector(model, detectorConfig);
                statusText.innerText = "Model loaded. Ready to start.";
                startBtn.disabled = false;
            } catch (error) {
                console.error("Error loading model:", error);
                statusText.innerText = "Error: Could not load model. " + error.message;
                throw error;
            }
        }

        function startTracking() {
            if (!detector) {
                statusText.innerText = "Error: Model not loaded.";
                return;
            }
            tracking = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            isDragging = false;

            smoothedX = window.innerWidth / 2;
            smoothedY = window.innerHeight / 2;
            crosshair.style.left = `${smoothedX}px`;
            crosshair.style.top = `${smoothedY}px`;
            crosshair.style.display = 'block';
            crosshair.classList.remove('dragging');

            statusText.innerText = "Tracking active...";
            trackHand();
        }

        function stopTracking() {
             tracking = false;
             if (rafId) cancelAnimationFrame(rafId);
             rafId = null;
             crosshair.style.display = 'none';
             crosshair.classList.remove('dragging');
             startBtn.disabled = false;
             stopBtn.disabled = true;
             isDragging = false;
             statusText.innerText = "Tracking stopped.";
        }


        function calculateDistance(p1, p2) {
            if (!p1 || !p2) return Infinity;
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }


        async function trackHand() {
            if (!tracking) return;

            let hands = [];
            let currentClickState = false;
            let currentThumbPosVideo = null;

            if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                console.warn("Video not ready, skipping frame.");
                rafId = requestAnimationFrame(trackHand);
                return;
            }

            try {
                 hands = await detector.estimateHands(video, { flipHorizontal: false });
            } catch (error) {
                 console.error("Error during hand estimation:", error);
                 statusText.innerText = "Error during estimation. Retrying...";
                 rafId = requestAnimationFrame(trackHand);
                 return;
            }

            if (hands.length > 0) {
                const keypoints = hands[0].keypoints;
                const thumbTip = keypoints.find(kp => kp.name === 'thumb_tip');
                const indexTip = keypoints.find(kp => kp.name === 'index_finger_tip');

                if (thumbTip) {
                    currentThumbPosVideo = { x: thumbTip.x, y: thumbTip.y };
                }

                if (thumbTip && indexTip) {
                    const distance = calculateDistance(thumbTip, indexTip);
                    if (distance < clickDistanceThreshold) {
                        currentClickState = true;
                    }
                }

                if (currentClickState && !isDragging && currentThumbPosVideo) {
                    isDragging = true;
                    relativeOriginVideo = currentThumbPosVideo;
                    relativeOriginScreen = { x: smoothedX, y: smoothedY };
                    crosshair.classList.add('dragging');
                    console.log("Drag Start");

                } else if (!currentClickState && isDragging) {
                    isDragging = false;
                    crosshair.classList.remove('dragging');
                    console.log("Drag End");
                }

            } else {
                if (isDragging) {
                    isDragging = false;
                    crosshair.classList.remove('dragging');
                    console.log("Drag End (Hand Lost)");
                }
            }

            if (isDragging && currentThumbPosVideo) {
                const deltaVideoX = currentThumbPosVideo.x - relativeOriginVideo.x;
                const deltaVideoY = currentThumbPosVideo.y - relativeOriginVideo.y;

                const deltaScreenX = -deltaVideoX * sensitivity;
                const deltaScreenY = deltaVideoY * sensitivity;

                let targetX = relativeOriginScreen.x + deltaScreenX;
                let targetY = relativeOriginScreen.y + deltaScreenY;

                targetX = Math.max(0, Math.min(window.innerWidth, targetX));
                targetY = Math.max(0, Math.min(window.innerHeight, targetY));

                smoothedX += (targetX - smoothedX) * smoothingFactor;
                smoothedY += (targetY - smoothedY) * smoothingFactor;
            }

             crosshair.style.left = `${smoothedX}px`;
             crosshair.style.top = `${smoothedY}px`;

            rafId = requestAnimationFrame(trackHand);
        }

        async function init() {
            try {
                await setupCamera();
                await loadModel();
                 smoothedX = window.innerWidth / 2;
                 smoothedY = window.innerHeight / 2;
            } catch (error) {
                console.error("Initialization failed:", error);
            }
        }

         window.addEventListener('resize', () => {
             if (!isDragging) {
                 smoothedX = window.innerWidth / 2;
                 smoothedY = window.innerHeight / 2;
                 if (tracking) {
                     crosshair.style.left = `${smoothedX}px`;
                     crosshair.style.top = `${smoothedY}px`;
                 }
             } else {
                 isDragging = false;
                 crosshair.classList.remove('dragging');
                 console.log("Drag interrupted by resize");
             }
         });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && tracking) {
                stopTracking();
            }
        });

        init();

    </script>
</body>
</html>
